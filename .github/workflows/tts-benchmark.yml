name: Bounded TTS benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen-cpu-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system audio tools
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - name: Install bounded benchmark dependencies
        run: pip install --no-cache-dir qwen-tts==0.1.1 psutil soundfile
      - name: Create a synthetic Chinese reference
        run: |
          mkdir -p .local/benchmark
          espeak-ng -v cmn -s 150 -w .local/benchmark/reference-raw.wav \
            "今天使用合成声音测试软件。这里没有用户声音，也没有书籍内容。"
          ffmpeg -hide_banner -loglevel error -y \
            -i .local/benchmark/reference-raw.wav -ar 24000 -ac 1 \
            .local/benchmark/reference.wav
      - name: Run one short CPU generation
        run: |
          python scripts/benchmark/stage0_qwen_benchmark.py \
            --reference .local/benchmark/reference.wav \
            --reference-text "今天使用合成声音测试软件。这里没有用户声音，也没有书籍内容。" \
            --text "这是一次有时间限制的软件基准。" \
            --output .local/benchmark/qwen-output.wav \
            --result .local/benchmark/result.json
          cat .local/benchmark/result.json
      - name: Validate output audio
        run: |
          test -s .local/benchmark/qwen-output.wav
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 .local/benchmark/qwen-output.wav

