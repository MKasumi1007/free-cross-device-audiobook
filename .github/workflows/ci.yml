name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile audit scripts
        run: python -m compileall -q scripts
      - name: Reject paid capabilities
        run: python scripts/free-tier-audit/check_forbidden_config.py
      - name: Scan tracked files for credentials
        run: python scripts/secret-scan/scan_repo.py

  project-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install web dependencies
        run: npm ci
      - name: Audit production web dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check Python style and types
        run: |
          ruff check services apps tests
          mypy services/audiobook-core/src apps/mac-agent/src
      - name: Run project tests
        run: npm test
      - name: Build the PWA
        run: npm run build
